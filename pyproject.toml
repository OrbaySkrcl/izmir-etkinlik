[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "izmir-etkinlik"
version = "1.0.0"
description = "İzmir etkinliklerini çoklu kaynaktan toplayan, tekilleştiren ve Telegram üzerinden sunan bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rapidfuzz>=3.9",
    "python-telegram-bot[job-queue]>=21.4",
    "SQLAlchemy>=2.0.31",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "tenacity>=8.5",
    "structlog>=24.4",
    "typer>=0.12",
    "rich>=13.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
izmir-etkinlik = "izmir_events.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
izmir_events = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
