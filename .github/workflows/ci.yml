name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Biçim kontrolü
        run: ruff format --check src tests

      - name: Tip kontrolü
        run: mypy src/izmir_events

      - name: Testler
        run: pytest -q --cov=izmir_events --cov-report=term-missing

      - name: Kaynak yapılandırmasını doğrula
        run: python -c "from izmir_events.config import load_sources; print(len(load_sources('config/sources.yaml')), 'kaynak yüklendi')"
